management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics"

spring:
  application:
    name: market-signal-engine
  kafka:
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${APP_KAFKA_CONSUMER_GROUP_ID:market-signal-engine}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    schema-registry:
      url: ${APP_SCHEMA_REGISTRY_URL:http://localhost:8081}
    topic:
      market-features: ${APP_KAFKA_TOPIC_MARKET_FEATURES:market.feature.snapshot.v1}
      market-signals: ${APP_KAFKA_TOPIC_MARKET_SIGNALS:state.market.signals.v1}

  signal:
    signal-set-version: ${APP_SIGNAL_SET_VERSION:mse-signals-v7}
    max-spread-bps: ${APP_SIGNAL_MAX_SPREAD_BPS:2.0}
    buy-flow-imbalance-5s-threshold: ${APP_SIGNAL_BUY_FLOW_IMBALANCE_5S_THRESHOLD:0.15}
    sell-flow-imbalance-5s-threshold: ${APP_SIGNAL_SELL_FLOW_IMBALANCE_5S_THRESHOLD:-0.15}
    min-trade-count-5s-for-trade-flow-signal: ${APP_SIGNAL_MIN_TRADE_COUNT_5S_FOR_TRADE_FLOW_SIGNAL:10}
    buy-book-imbalance-threshold: ${APP_SIGNAL_BUY_BOOK_IMBALANCE_THRESHOLD:0.60}
    sell-book-imbalance-threshold: ${APP_SIGNAL_SELL_BOOK_IMBALANCE_THRESHOLD:-0.60}
    # Uncalibrated placeholder (log-return bps, MFS v2 units): blocks only extreme 1s regimes.
    # Calibrated value comes from the first replay pass — see docs/path-to-paper-trading.md §8.2.
    max-realized-volatility-bps-1s: ${APP_SIGNAL_MAX_REALIZED_VOLATILITY_BPS_1S:50.0}
    microstructure-setup-ttl-ms: ${APP_SIGNAL_MICROSTRUCTURE_SETUP_TTL_MS:2000}
    risk-off-ttl-ms: ${APP_SIGNAL_RISK_OFF_TTL_MS:5000}
    neutral-ttl-ms: ${APP_SIGNAL_NEUTRAL_TTL_MS:1000}
